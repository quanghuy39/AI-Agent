# config/llm.yaml - KHÔNG chứa khóa API. Khóa nằm trong .env (api_key_env chỉ là tên biến).
# Số liệu hạn mức lấy từ trang hạn mức của từng hãng ngày 27/10/2026. Các số khởi điểm chỉnh sau khi chạy thật.

settings:
  # 31/10/2026: report có 2 model kiểm định; vẫn false vì bật thì analysis chỉ còn 1 model (mất fallback)
  # không bật enforce vì report/slide chưa có model kiểm định (bật được thì làm ở Ngày 7)
  enforce_validation: false   # false: chạy cả model chưa qua kiểm định.
  timeout_s: 60
  num_retries: 1              # số lần thử lại khi 5xx hoặc timeout, trước khi chuyển hãng kế
  retry_after_s: 5
  cooldown_s: 60              # thời gian một mục bị tạm loại sau khi hết hạn mức hoặc lỗi lặp lại
  cooldown_max_s: 3600
  cooldown_not_found_s: 3600
  cooldown_whole_provider: [openrouter]
  allowed_fails: 2
  json_retries: 2             # số lần thử lại khi JSON sai schema
  cache_path: cache/llm_cache.sqlite
  usage_log_path: cache/llm_usage.jsonl

# ---------- Danh sách model ----------
# litellm_model: tên theo LiteLLM (tiền tố hãng/tên model). Xác nhận bằng lần gọi thật ở mục 5.
# limits: null = chưa biết. rpm = request/phút, rpd = request/ngày, tpm = token/phút, tpd = token/ngày.
# max_input_tokens, max_tokens: giới hạn tự đặt để không vượt hạn mức token/phút.
models:
  gemini_3_8_flash:
    provider: gemini
    litellm_model: gemini/gemini-3.8-flash
    api_key_env: GEMINI_API_KEY
    limits: {rpm: 5, rpd: 20, tpm: 250000, tpd: null}
    max_input_tokens: 30000
    max_tokens: 4000
    data_note: "Gói free: Google dùng dữ liệu để cải thiện sản phẩm, không tắt được. Chỉ gửi dữ liệu không nhạy cảm. Gọi thật 28/10/2026 trả 503 quá tải nhất thời (tên model và khóa đúng). 30/10/2026: lỗi 503/408 phía Google kể cả prompt ngắn, tạm xếp cuối chuỗi analysis."

  gemini_3_5_flash_lite:
    provider: gemini
    litellm_model: gemini/gemini-3.5-flash-lite
    api_key_env: GEMINI_API_KEY
    limits: {rpm: 15, rpd: 500, tpm: 250000, tpd: null}
    max_input_tokens: 30000
    max_tokens: 4000
    data_note: "Như trên."

  gemma_4_31b:
    provider: gemini
    litellm_model: gemini/gemma-4-31b-it
    api_key_env: GEMINI_API_KEY
    limits: {rpm: 30, rpd: 14400, tpm: 16000, tpd: null}
    max_input_tokens: 9000      # tpm chỉ 16K, gồm cả prompt lẫn phản hồi
    max_tokens: 3000
    data_note: "Như trên. Gọi thật 28/10/2026 trả 500 Internal error sau 36 giây, cần thử lại. 30/10/2026: lỗi 503/408 phía Google kể cả prompt ngắn, tạm xếp cuối chuỗi analysis."

  mistral_codestral:
    provider: mistral
    litellm_model: mistral/codestral-2508
    api_key_env: MISTRAL_API_KEY
    limits: {rpm: 125, rpd: null, tpm: 625000, tpd: null}   # 2,08 request/giây
    max_input_tokens: 30000
    max_tokens: 4000
    data_note: "Đã tắt huấn luyện trong Privacy (người dùng xác nhận 27/10/2026)."

  mistral_ministral_14b:
    provider: mistral
    litellm_model: mistral/ministral-14b-2512
    api_key_env: MISTRAL_API_KEY
    limits: {rpm: 30, rpd: null, tpm: 937500, tpd: null}
    max_input_tokens: 30000
    max_tokens: 4000
    data_note: "Đã tắt huấn luyện trong Privacy (người dùng xác nhận 27/10/2026). mistral-small và mistral-medium bị chặn ở gói free (0 request/phút), mistral-large trả 403."

  groq_gpt_oss_120b:
    provider: groq
    litellm_model: groq/openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY
    limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}
    max_input_tokens: 5000      # tpm chỉ 8K nên phải giữ nhỏ
    max_tokens: 2000
    data_note: "Người dùng đã đọc điều khoản Groq (27/10/2026)."

  groq_gpt_oss_20b:
    provider: groq
    litellm_model: groq/openai/gpt-oss-20b
    api_key_env: GROQ_API_KEY
    limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}
    max_input_tokens: 5000
    max_tokens: 2000
    data_note: "Như trên."

  openrouter_cohere_north_mini_code:
    provider: openrouter
    litellm_model: openrouter/cohere/north-mini-code:free
    api_key_env: OPENROUTER_API_KEY
    limits: {rpm: 20, rpd: 50, tpm: null, tpd: null}
    max_input_tokens: 12000
    max_tokens: 4000
    data_note: "Gọi thật 28/10/2026 qua Cohere, vượt bộ lọc riêng tư. Chỉ ~3B tham số hoạt động, chất lượng chưa biết. Hạn mức dùng chung cho mọi model :free. nemotron-3-super đã bị gỡ khỏi gói free; nemotron-3-ultra, nemotron-3.5-lightning bị chặn bởi bộ lọc huấn luyện; inkling-small chỉ dùng được trong agent harness."

# ---------- Chuỗi fallback theo vai trò ----------
# Thứ tự từ trên xuống. validated: true chỉ khi model đã qua bộ kiểm định của vai trò đó (Ngày 5).
roles:
  analysis:
    chain:
      - {model: gemini_3_5_flash_lite, validated: true}
      - {model: mistral_codestral, validated: false}
      - {model: gemini_3_8_flash, validated: false}
      - {model: gemma_4_31b, validated: false}
      # openrouter_cohere_north_mini_code bỏ khỏi analysis 30/10/2026 (rớt json_valid); vẫn ở report/slide
      # groq_gpt_oss_120b bỏ khỏi analysis 30/10/2026: chưa qua kiểm định, tpm 8000 quá nhỏ cho prompt analysis,
      # làm trần ngữ cảnh 5000 khiến bài 1 dừng ở Q4; vẫn ở report/slide

  report:
    # 31/10/2026 kiểm định report (10 case, prompt Ngày 2 - sàng lọc năng lực chung):
    # flash_lite 9/10 (placeholder_ok), ministral 9/10 (placeholder_ok) -> validated.
    # Bỏ groq_gpt_oss_120b (10/10, đủ điều kiện validated) vì max_input_tokens 5000 kéo trần ngữ cảnh
    #   cả chuỗi xuống 4.500; đưa lại nếu prompt tổng hợp đo được vừa trần đó.
    # Bỏ openrouter_cohere_north_mini_code: rớt no_typed_numbers (tự gõ số) - lỗi nặng.
    # Bỏ gemma_4_31b: lỗi 500 phía Google, chưa kiểm định xong.
    chain:
      - {model: gemini_3_5_flash_lite, validated: true}
      - {model: mistral_ministral_14b, validated: true}

  slide:
    chain:
      - {model: gemini_3_5_flash_lite, validated: false}
      - {model: mistral_ministral_14b, validated: false}
      - {model: groq_gpt_oss_20b, validated: false}
      - {model: openrouter_cohere_north_mini_code, validated: false}